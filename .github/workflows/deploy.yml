name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.deploy }}
          SSH_HOST: 145.79.20.115
          SSH_USER: u530593910
          SSH_PORT: 65002
          REMOTE_DIR: /home/u530593910/domains/bubbleteacat.com/public_html
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger_deploy
          chmod 600 ~/.ssh/hostinger_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/hostinger_deploy -p $SSH_PORT" \
            ./website/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
