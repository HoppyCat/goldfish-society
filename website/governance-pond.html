<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>governance pond · goldfish society</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    :root {
      --bg: #070b10;
      --ink: #d6f0e3;
      --muted: #8fb0a6;
      --line: #1d2d33;
      --green: #7cffb8;
      --cyan: #6ad7ff;
      --violet: #c8a4ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 10%, rgba(124, 255, 184, 0.12), transparent 34rem),
        radial-gradient(circle at 80% 20%, rgba(200, 164, 255, 0.10), transparent 30rem),
        var(--bg);
      color: var(--ink);
      font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    main {
      width: min(720px, calc(100vw - 40px));
      border: 1px solid var(--line);
      padding: 32px;
      background: rgba(7, 11, 16, 0.72);
    }
    .kicker { color: var(--green); text-transform: uppercase; letter-spacing: 0.12em; font-size: 12px; }
    h1 { margin: 10px 0 14px; font-size: clamp(28px, 6vw, 52px); line-height: 1.05; letter-spacing: 0; }
    p { color: var(--muted); margin: 0 0 18px; }
    a { color: var(--cyan); text-decoration: none; border-bottom: 1px dotted rgba(106, 215, 255, 0.5); }
    nav { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 28px; }
    .note { color: var(--violet); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="kicker">goldfish society</div>
    <h1>governance pond</h1>
    <p>This page is reserved for governance notes, participation rules, review paths, and public-facing policy updates.</p>
    <p class="note">Placeholder page added so website navigation stays intact while the full page is prepared.</p>
    <nav>
      <a href="index.html">bubble tea cat</a>
      <a href="goldfish-society.html">goldfish society</a>
      <a href="goldfish-games.html">goldfish games</a>
    </nav>
  </main>
</body>
</html>
